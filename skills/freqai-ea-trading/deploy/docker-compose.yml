# Runs the three primary EAs unattended (one container each): ETH and SOL on their USDT-M futures EAs
# (config_*_perp.json, isolated margin, long + short), BTC on its spot EA. Start in dry-run first:
#   cp deploy/ea.env.example deploy/ea.env    # fill in, never commit
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f btc-ea
# Live trading: set FREQTRADE__DRY_RUN=false in ea.env only after the checklist in
# references/deployment.md. Each bot trades one coin; give each its own sub-account, or set
# FREQTRADE__AVAILABLE_CAPITAL per service if they share one account.

x-ea: &ea
  build: { context: ., dockerfile: Dockerfile }
  image: freqai-ea:2026.10
  restart: unless-stopped
  env_file: [ea.env]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  btc-ea:
    <<: *ea
    container_name: btc-ea
    volumes:
      - ../user_data:/freqtrade/ea:ro        # strategies, FreqAI model class, configs (read-only)
      - btc-data:/freqtrade/user_data     # this bot's candles, FreqAI models, trade DB, logs
    command: >
      trade --config /freqtrade/ea/configs/config_btc_ea.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/btc-ea.sqlite
      --logfile /freqtrade/user_data/logs/btc-ea.log
  eth-ea:
    <<: *ea
    container_name: eth-ea
    volumes:
      - ../user_data:/freqtrade/ea:ro        # strategies, FreqAI model class, configs (read-only)
      - eth-data:/freqtrade/user_data     # this bot's candles, FreqAI models, trade DB, logs
    command: >
      trade --config /freqtrade/ea/configs/config_eth_perp.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/eth-ea.sqlite
      --logfile /freqtrade/user_data/logs/eth-ea.log
  sol-ea:
    <<: *ea
    container_name: sol-ea
    volumes:
      - ../user_data:/freqtrade/ea:ro        # strategies, FreqAI model class, configs (read-only)
      - sol-data:/freqtrade/user_data     # this bot's candles, FreqAI models, trade DB, logs
    command: >
      trade --config /freqtrade/ea/configs/config_sol_perp.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/sol-ea.sqlite
      --logfile /freqtrade/user_data/logs/sol-ea.log

  # Live guard (maintenance/ea_guard.py live): every 15 minutes checks each bot's REST API -
  # heartbeat, exchange stop orders, drawdown since high-water mark, losing streak - and sends
  # /stopentry to a bot that reaches HALT. It never resumes a bot or changes anything else.
  ea-guard:
    image: freqai-ea:2026.10
    container_name: ea-guard
    restart: unless-stopped
    env_file: [ea.env]
    environment:
      EA_GUARD_BOTS: btc=http://btc-ea:8080,eth=http://eth-ea:8080,sol=http://sol-ea:8080
    volumes:
      - ../maintenance:/freqtrade/maintenance:ro
      - guard-data:/freqtrade/user_data
    entrypoint: ["python", "/freqtrade/maintenance/ea_guard.py"]
    command: ["live", "--act", "--loop", "900",
              "--state", "/freqtrade/user_data/guard/live_state.json",
              "--md", "/freqtrade/user_data/guard/latest.md",
              "--json", "/freqtrade/user_data/guard/latest.json"]
    depends_on: [btc-ea, eth-ea, sol-ea]

volumes:
  btc-data:
  eth-data:
  sol-data:
  guard-data:
