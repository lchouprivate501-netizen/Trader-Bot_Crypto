# Runs the three EAs unattended (one container each). Start in dry-run first:
#   cp deploy/ea.env.example deploy/ea.env    # fill in, never commit
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f btc-ea
# Live trading: set FREQTRADE__DRY_RUN=false in ea.env only after the checklist in
# references/deployment.md. Each bot trades one coin; give each its own sub-account, or set
# FREQTRADE__AVAILABLE_CAPITAL per service if they share one account.

x-ea: &ea
  build: { context: ., dockerfile: Dockerfile }
  image: freqai-ea:2026.10
  restart: unless-stopped
  env_file: [ea.env]
  volumes:
    - ../user_data:/freqtrade/ea:ro          # strategies, FreqAI model class, configs (read-only)
    - ea-data:/freqtrade/user_data           # candles, FreqAI models, trade databases, logs
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  btc-ea:
    <<: *ea
    container_name: btc-ea
    command: >
      trade --config /freqtrade/ea/configs/config_btc_ea.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/btc-ea.sqlite
      --logfile /freqtrade/user_data/logs/btc-ea.log
  eth-ea:
    <<: *ea
    container_name: eth-ea
    command: >
      trade --config /freqtrade/ea/configs/config_eth_ea.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/eth-ea.sqlite
      --logfile /freqtrade/user_data/logs/eth-ea.log
  sol-ea:
    <<: *ea
    container_name: sol-ea
    command: >
      trade --config /freqtrade/ea/configs/config_sol_ea.json
      --userdir /freqtrade/user_data
      --strategy-path /freqtrade/ea/strategies --freqaimodel-path /freqtrade/ea/freqaimodels
      --db-url sqlite:////freqtrade/user_data/sol-ea.sqlite
      --logfile /freqtrade/user_data/logs/sol-ea.log

volumes:
  ea-data:
