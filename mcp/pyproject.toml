[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pionex-trading-skills"
version = "2.1.0"
description = "MCP tools for Trader Bot (R&D on nautilus_trader + rule-based execution desk). No exchange keys, no orders. Module name kept as pionex_trading_skills for connector compatibility."
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
  "mcp==2.3.0",
  "nautilus_trader==1.231.0",
  "optuna==5.0.0",
  "pandas==2.3.3",
  "pyarrow==26.0.1",
  "requests==2.32.5",
]

[project.scripts]
pionex-trading-skills = "pionex_trading_skills.server:main"

[tool.setuptools.packages.find]
include = ["pionex_trading_skills*"]
